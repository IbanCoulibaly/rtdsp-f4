<svg width="1400" height="440" viewBox="0 0 1400 440" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="1400" height="440" fill="#ffffff"/>

  <text x="700" y="38" text-anchor="middle" font-size="24" font-weight="bold" fill="#111827">System Architecture</text>
  <text x="700" y="60" text-anchor="middle" font-size="13.5" fill="#6b7280">A filter is designed on a PC, sent to the microcontroller, run in real time, and its output verified bit-exact</text>

  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#374151"/></marker>
    <marker id="arrowReturn" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#9ca3af"/></marker>
  </defs>

  <!-- Block 1: Host -->
  <rect x="50" y="110" width="290" height="190" rx="12" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="195" y="148" text-anchor="middle" font-size="19" font-weight="bold" fill="#1e3a8a">Host (Python)</text>
  <line x1="80" y1="160" x2="310" y2="160" stroke="#bfdbfe" stroke-width="1"/>
  <text x="195" y="188" text-anchor="middle" font-size="14" fill="#1e3a8a">Design the filter</text>
  <text x="195" y="214" text-anchor="middle" font-size="14" fill="#1e3a8a">Quantise for hardware</text>
  <text x="195" y="240" text-anchor="middle" font-size="14" fill="#1e3a8a">Upload &amp; verify results</text>

  <!-- Block 2: Serial link -->
  <rect x="405" y="110" width="245" height="190" rx="12" fill="#f3f4f6" stroke="#374151" stroke-width="2"/>
  <text x="527" y="148" text-anchor="middle" font-size="19" font-weight="bold" fill="#1f2937">Serial Link</text>
  <line x1="435" y1="160" x2="620" y2="160" stroke="#d1d5db" stroke-width="1"/>
  <text x="527" y="188" text-anchor="middle" font-size="14" fill="#1f2937">CRC-checked frames</text>
  <text x="527" y="214" text-anchor="middle" font-size="14" fill="#1f2937">(COBS + CRC-16)</text>
  <text x="527" y="240" text-anchor="middle" font-size="14" fill="#1f2937">921,600 baud</text>

  <!-- Block 3: MCU -->
  <rect x="720" y="110" width="310" height="190" rx="12" fill="#ecfdf5" stroke="#047857" stroke-width="2"/>
  <text x="875" y="148" text-anchor="middle" font-size="19" font-weight="bold" fill="#065f46">STM32F405 + FreeRTOS</text>
  <line x1="750" y1="160" x2="1000" y2="160" stroke="#a7f3d0" stroke-width="1"/>
  <text x="875" y="188" text-anchor="middle" font-size="14" fill="#065f46">Real-time filter pipeline</text>
  <text x="875" y="214" text-anchor="middle" font-size="14" fill="#065f46">48,000 samples / second</text>
  <text x="875" y="240" text-anchor="middle" font-size="14" fill="#065f46">Self-monitoring &amp; fault-tolerant</text>

  <!-- Block 4: Verification -->
  <rect x="1095" y="110" width="255" height="190" rx="12" fill="#f5f3ff" stroke="#6d28d9" stroke-width="2"/>
  <text x="1222" y="148" text-anchor="middle" font-size="19" font-weight="bold" fill="#4c1d95">Verification</text>
  <line x1="1125" y1="160" x2="1320" y2="160" stroke="#ddd6fe" stroke-width="1"/>
  <text x="1222" y="188" text-anchor="middle" font-size="14" fill="#4c1d95">3 independent checks</text>
  <text x="1222" y="214" text-anchor="middle" font-size="14" fill="#4c1d95">bit-exact comparison</text>
  <text x="1222" y="240" text-anchor="middle" font-size="14" fill="#4c1d95">3,750 automated tests</text>

  <!-- forward arrows -->
  <g stroke="#374151" stroke-width="2.5" fill="none" marker-end="url(#arrow)">
    <path d="M345,200 H400"/>
    <path d="M655,200 H715"/>
    <path d="M1035,200 H1090"/>
  </g>

  <!-- return path -->
  <path d="M875,300 C875,350 195,350 195,310" stroke="#9ca3af" stroke-width="2" fill="none"
        stroke-dasharray="6,4" marker-end="url(#arrowReturn)"/>
  <text x="535" y="372" text-anchor="middle" font-size="13" fill="#6b7280">Filtered output streams back over the same link and is checked against a reference model</text>

  <text x="700" y="420" text-anchor="middle" font-size="12.5" fill="#9ca3af">Full task graph, timing budget and fault-handling detail: docs/ARCHITECTURE.md</text>
</svg>
