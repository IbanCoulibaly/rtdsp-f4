<svg width="1400" height="520" viewBox="0 0 1400 520" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="1400" height="520" fill="#ffffff"/>

  <text x="700" y="42" text-anchor="middle" font-size="24" font-weight="bold" fill="#111827">RTDSP-F4, by the numbers</text>
  <text x="700" y="66" text-anchor="middle" font-size="13" fill="#6b7280">every number below is measured from this repository, not estimated -- see the links under each card</text>

  <!-- card template: 420 wide x 190 tall, 3 cols x 2 rows -->
  <!-- Card 1 -->
  <g>
    <rect x="40" y="100" width="420" height="190" rx="12" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
    <text x="70" y="175" font-size="46" font-weight="bold" fill="#1d4ed8">48,000</text>
    <text x="70" y="205" font-size="14.5" fill="#1e3a8a">audio samples measured and</text>
    <text x="70" y="225" font-size="14.5" fill="#1e3a8a">filtered every single second</text>
    <text x="70" y="262" font-size="11" fill="#60a5fa">docs/DSP_MATH.md §2.1</text>
  </g>

  <!-- Card 2 -->
  <g>
    <rect x="490" y="100" width="420" height="190" rx="12" fill="#f0fdf4" stroke="#047857" stroke-width="1.5"/>
    <text x="520" y="175" font-size="46" font-weight="bold" fill="#047857">3,750</text>
    <text x="520" y="205" font-size="14.5" fill="#065f46">automated checks that must</text>
    <text x="520" y="225" font-size="14.5" fill="#065f46">all pass before anything ships</text>
    <text x="520" y="262" font-size="11" fill="#6ee7b7">3,686 unit + 47 SIL + 17 QEMU, every push</text>
  </g>

  <!-- Card 3 -->
  <g>
    <rect x="940" y="100" width="420" height="190" rx="12" fill="#fff7ed" stroke="#c2410c" stroke-width="1.5"/>
    <text x="970" y="175" font-size="46" font-weight="bold" fill="#c2410c">~1.3 ms</text>
    <text x="970" y="205" font-size="14.5" fill="#7c2d12">delay the filter adds --</text>
    <text x="970" y="225" font-size="14.5" fill="#7c2d12">far faster than a person can notice</text>
    <text x="970" y="262" font-size="11" fill="#fdba74">docs/DSP_MATH.md §2.3 (block latency)</text>
  </g>

  <!-- Card 4 -->
  <g>
    <rect x="40" y="310" width="420" height="190" rx="12" fill="#fdf4ff" stroke="#7e22ce" stroke-width="1.5"/>
    <text x="70" y="385" font-size="46" font-weight="bold" fill="#7e22ce">2.5% / 19%</text>
    <text x="70" y="415" font-size="14.5" fill="#581c87">of the chip's storage / working</text>
    <text x="70" y="435" font-size="14.5" fill="#581c87">memory used -- tiny, even for a $5 chip</text>
    <text x="70" y="472" font-size="11" fill="#d8b4fe">linker --print-memory-usage, measured</text>
  </g>

  <!-- Card 5 -->
  <g>
    <rect x="490" y="310" width="420" height="190" rx="12" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.5"/>
    <text x="520" y="385" font-size="46" font-weight="bold" fill="#b91c1c">74-88 dB</text>
    <text x="520" y="415" font-size="14.5" fill="#7f1d1d">output quality -- practically identical</text>
    <text x="520" y="435" font-size="14.5" fill="#7f1d1d">to a perfect, idealized filter</text>
    <text x="520" y="472" font-size="11" fill="#fca5a5">SQNR vs. float64 design, measured on the board</text>
  </g>

  <!-- Card 6 -->
  <g>
    <rect x="940" y="310" width="420" height="190" rx="12" fill="#f8fafc" stroke="#334155" stroke-width="1.5"/>
    <text x="970" y="385" font-size="46" font-weight="bold" fill="#334155">5</text>
    <text x="970" y="415" font-size="14.5" fill="#1e293b">ready-made filter examples, each</text>
    <text x="970" y="435" font-size="14.5" fill="#1e293b">verified three independent ways</text>
    <text x="970" y="472" font-size="11" fill="#94a3b8">python/rtdsp/catalog.py -- see docs/TESTING.md</text>
  </g>
</svg>
